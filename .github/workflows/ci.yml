name: CI Privio

on:
  push:
    branches: [main, develop]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.8"
  SUPABASE_CLI_VERSION: "2.122.1"

jobs:
  garde-fous:
    name: Garde-fous de conformité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/guards.sh

  base-de-donnees:
    name: Migrations, RLS, Auth, messagerie et vocaux (Supabase local)
    needs: garde-fous
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Démarrer Supabase (base, Auth, API, Storage, fonctions)
        run: >
          supabase start -x imgproxy,mailpit,postgres-meta,studio,logflare,vector,supavisor
      - name: Tests pgTAP (sécurité, profils, recherche, appareils, politiques, messagerie, vocaux)
        run: supabase test db
      - name: Test de concurrence (scénario AUTH n°4)
        run: DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres scripts/db/concurrency_handle_test.sh
      - name: Test de concurrence (messagerie)
        run: DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres scripts/db/concurrency_messaging_test.sh
      - name: Test d'intégration Auth téléphone + RPC + messagerie + temps réel + vocaux (Storage, fonctions)
        run: |
          pip install --quiet websockets==15.0.1
          scripts/ci/auth_smoke_test.sh
      - name: Preuve — purge planifiée et canal temps réel privé installés
        run: |
          DB=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          test "$(psql "$DB" -tAc "select schedule from cron.job where jobname='privio_purge_expired'")" = "* * * * *"
          test "$(psql "$DB" -tAc "select count(*) from pg_policies where schemaname='realtime' and policyname='privio_own_user_topic'")" = "1"
          test "$(psql "$DB" -tAc "select schedule from cron.job where jobname='privio_media_purge'")" = "* * * * *"
          test "$(psql "$DB" -tAc "select public from storage.buckets where id='voice'")" = "f"
          echo "✅ purge pg_cron chaque minute ; ✅ politique Realtime « user:<id> » active"
          echo "✅ effacement physique des sons planifié chaque minute ; ✅ bucket « voice » privé"
      - name: Lint SQL
        run: supabase db lint --level error --fail-on error
      - if: always()
        run: supabase stop --no-backup

  mobile:
    name: Flutter — analyse, tests, APK de test
    needs: garde-fous
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Formatage
        run: dart format --line-length 100 --output=none --set-exit-if-changed lib test
      - name: Analyse statique
        run: flutter analyze --fatal-infos
      - name: Tests unitaires et widgets
        run: flutter test --coverage
      - name: Clé de signature stable (secrets GitHub)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 absent : APK signé avec une clé temporaire (désinstallation nécessaire à chaque version)."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/privio.jks"
          {
            echo "PRIVIO_KEYSTORE_PATH=$RUNNER_TEMP/privio.jks"
            echo "PRIVIO_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "PRIVIO_KEY_PASSWORD=$KEYSTORE_PASSWORD"
            echo "PRIVIO_KEY_ALIAS=privio"
          } >> "$GITHUB_ENV"
          echo "Clé stable chargée."
      - name: APK de test (staging, release découpé par processeur)
        # Valeurs PUBLIQUES (variables de dépôt, pas des secrets). Sans elles, l'APK
        # se compile mais affiche un écran « configuration absente ».
        # Signature : clé de debug du runner (test uniquement ; clé stable à l'étape 6).
        run: >
          flutter build apk --release --split-per-abi
          --obfuscate --split-debug-info=build/symboles
          --dart-define=SUPABASE_URL=${{ vars.STAGING_SUPABASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          --dart-define=PRIVIO_ENV=staging
          --dart-define=APP_VERSION=0.1.0+${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: privio-apk-arm64-${{ github.run_number }}
          path: apps/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: privio-apk-32bits-${{ github.run_number }}
          path: apps/mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: couverture-tests-${{ github.run_number }}
          path: apps/mobile/coverage/lcov.info
          retention-days: 14
