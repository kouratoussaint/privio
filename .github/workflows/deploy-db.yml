name: Déployer les migrations (manuel)

# Applique les migrations SQL (`supabase db push`) puis déploie les fonctions serveur
# (voice-send, photo-send, avatar-set, media-purge) au projet choisi.
# Ne pousse JAMAIS config.toml (les numéros OTP de test resteraient actifs 10 ans).
on:
  workflow_dispatch:
    inputs:
      environnement:
        description: "Environnement cible"
        required: true
        default: staging
        type: choice
        options: [staging]

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environnement }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: scripts/guards.sh
      - uses: supabase/setup-cli@v1
        with:
          version: "2.122.1"
      - name: Lier le projet
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --password "$SUPABASE_DB_PASSWORD"
      - name: Migrations en attente (aperçu)
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"
      - name: Appliquer les migrations
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Compte de service FCM (notifications), s'il est fourni
        env:
          FCM_SA_B64: ${{ secrets.FCM_SERVICE_ACCOUNT_B64 }}
        run: |
          if [ -z "$FCM_SA_B64" ]; then
            echo "::warning::Secret FCM_SERVICE_ACCOUNT_B64 absent : notifications désactivées (rien n'est envoyé)."
            exit 0
          fi
          echo "$FCM_SA_B64" | base64 -d > "$RUNNER_TEMP/fcm.json"
          supabase secrets set --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            FCM_SERVICE_ACCOUNT="$(cat "$RUNNER_TEMP/fcm.json")" > /dev/null
          rm -f "$RUNNER_TEMP/fcm.json"
          echo "✅ compte de service FCM transmis aux fonctions"
      - name: Clé KLIPY (GIF), si elle est fournie
        env:
          KLIPY_API_KEY: ${{ secrets.KLIPY_API_KEY }}
        run: |
          if [ -z "$KLIPY_API_KEY" ]; then
            echo "::warning::Secret KLIPY_API_KEY absent : GIF indisponibles."
            exit 0
          fi
          supabase secrets set --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            KLIPY_API_KEY="$KLIPY_API_KEY" > /dev/null
          echo "✅ clé KLIPY transmise aux fonctions"
      - name: Clé du relais d'appels Cloudflare, si elle est fournie
        env:
          TURN_KEY_ID: ${{ secrets.CLOUDFLARE_TURN_KEY_ID }}
          TURN_TOKEN: ${{ secrets.CLOUDFLARE_TURN_API_TOKEN }}
        run: |
          if [ -z "$TURN_KEY_ID" ] || [ -z "$TURN_TOKEN" ]; then
            echo "::warning::Secrets CLOUDFLARE_TURN_* absents : appels sans relais (passent quand le réseau le permet)."
            exit 0
          fi
          supabase secrets set --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            CLOUDFLARE_TURN_KEY_ID="$TURN_KEY_ID" CLOUDFLARE_TURN_API_TOKEN="$TURN_TOKEN" > /dev/null
          echo "✅ clé du relais d'appels transmise aux fonctions"
      - name: Déployer les fonctions (vocaux, photos, photo de profil, effacement des fichiers, notifications, GIF, aperçus des liens, appels)
        # Authentification vérifiée par la base (jeton utilisateur / jeton de purge).
        run: >
          supabase functions deploy voice-send photo-send avatar-set media-purge push-dispatch gif-search gif-send link-preview call-ice --use-api --no-verify-jwt
          --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
      - name: Déclarer l'adresse des fonctions à la base (purge planifiée)
        # media-purge appelée sans jeton : elle enregistre son adresse et ne fait rien d'autre.
        run: |
          URL="https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/media-purge"
          for i in 1 2 3 4 5 6; do
            R=$(curl -sS -X POST "$URL" -H "apikey: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}" || true)
            echo "$R" | grep -q '"registered":true' && { echo "✅ fonctions déployées et adresse déclarée"; exit 0; }
            sleep 10
          done
          echo "::error::media-purge ne répond pas : $R"; exit 1
