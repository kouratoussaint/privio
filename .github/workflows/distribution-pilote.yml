name: Distribution aux testeurs pilotes (Firebase App Distribution)

# Lot 6.1 (ADR-055) : envoie une version de test aux testeurs pilotes, qui la reçoivent
# par e-mail et l'installent avec l'application « App Tester » de Firebase (gratuit).
# Projet Firebase existant : privio-e1ef4. Lancement manuel seulement.
#
# À configurer une fois (Paramètres du dépôt → Secrets and variables → Actions) :
#   secret FIREBASE_DISTRIBUTION_SA : clé JSON d'un compte de service du projet
#     privio-e1ef4 ayant le rôle « Administrateur Firebase App Distribution ».
# Les groupes de testeurs se créent dans la console Firebase (App Distribution →
# Testeurs et groupes), par exemple « pilote-arm64 » et « pilote-32bits ».

on:
  workflow_dispatch:
    inputs:
      processeur:
        description: "Téléphones visés"
        type: choice
        options: [arm64, 32bits]
        default: arm64
      groupes:
        description: "Groupes de testeurs Firebase (séparés par des virgules)"
        default: pilote-arm64
      notes:
        description: "Ce qui change dans cette version (visible par les testeurs)"
        default: "Nouvelle version de test de Privio."

concurrency:
  group: distribution-pilote
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.8"
  # Identifiant PUBLIC de l'application Android dans Firebase (lib/core/config/firebase_options.dart).
  FIREBASE_APP_ID: "1:1038472124226:android:8280b53240d3cde49adadb"

jobs:
  distribuer:
    name: Construire et distribuer (${{ inputs.processeur }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Compte de service présent ?
        env:
          SA: ${{ secrets.FIREBASE_DISTRIBUTION_SA }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Secret FIREBASE_DISTRIBUTION_SA absent : voir l'en-tête de ce fichier pour le configurer."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Clé de signature stable (secrets GitHub)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 absent : les testeurs devraient désinstaller à chaque version."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/privio.jks"
          {
            echo "PRIVIO_KEYSTORE_PATH=$RUNNER_TEMP/privio.jks"
            echo "PRIVIO_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "PRIVIO_KEY_PASSWORD=$KEYSTORE_PASSWORD"
            echo "PRIVIO_KEY_ALIAS=privio"
          } >> "$GITHUB_ENV"
      - name: APK pilote (staging)
        run: >
          flutter build apk --release --split-per-abi
          --obfuscate --split-debug-info=build/symboles
          --dart-define=SUPABASE_URL=${{ vars.STAGING_SUPABASE_URL }}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          --dart-define=PRIVIO_ENV=staging
          --dart-define=APP_VERSION=0.1.0+${{ github.run_number }}-pilote
      - name: Distribuer
        env:
          SA: ${{ secrets.FIREBASE_DISTRIBUTION_SA }}
          NOTES: ${{ inputs.notes }}
          GROUPES: ${{ inputs.groupes }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          case "${{ inputs.processeur }}" in
            arm64) APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ;;
            32bits) APK=build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ;;
          esac
          npx --yes firebase-tools appdistribution:distribute "$APK" \
            --app "$FIREBASE_APP_ID" --groups "$GROUPES" --release-notes "$NOTES"
          rm -f "$RUNNER_TEMP/sa.json"
          echo "Version 0.1.0+${{ github.run_number }}-pilote (${{ inputs.processeur }}) envoyée à : $GROUPES" >> "$GITHUB_STEP_SUMMARY"
      # Symboles de cette version : ils traduisent les lignes d'un journal technique
      # (flutter symbolize). Gardés 90 jours, pour les versions pilotes seulement.
      - uses: actions/upload-artifact@v4
        with:
          name: symboles-pilote-${{ github.run_number }}-${{ inputs.processeur }}
          path: apps/mobile/build/symboles
          retention-days: 90
