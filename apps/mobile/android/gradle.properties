org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# AGP 9.1 recommande au plus le SDK 36 ; le SDK 37 est requis par permission_handler (voir app/build.gradle.kts).
android.suppressUnsupportedCompileSdk=37

# Lot 6.1 : lecteur de QR code (mobile_scanner) fourni par les services Google Play au lieu
# d'être embarqué dans l'APK (≈ 5 Mo de moins ; téléchargé une fois par le téléphone).
dev.steenbakker.mobile_scanner.useUnbundled=true
