include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
  errors:
    unawaited_futures: warning

linter:
  rules:
    - avoid_print
    - prefer_const_constructors
    - prefer_final_locals
    - prefer_relative_imports
    - unawaited_futures
    - cancel_subscriptions
    - close_sinks
    - use_build_context_synchronously

# Lot 8.2a : même largeur pour `dart format` et pour le code généré des traductions
# (gen-l10n, option `format: true` de l10n.yaml).
formatter:
  page_width: 100
