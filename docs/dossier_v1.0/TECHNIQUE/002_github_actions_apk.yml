name: Privio Android CI (starter)
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      - name: Build unsigned/debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: privio-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
# Squelette uniquement : il faut d'abord créer apps/mobile, fixer versions et ajouter tests Supabase/RLS.
# Pour la release signée : utiliser GitHub Secrets, environnement protégé et workflow distinct.
